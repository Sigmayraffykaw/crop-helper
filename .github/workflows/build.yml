name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 25 for Loom (compile target remains Java 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'
      - name: Build
        run: gradle build
      - name: Prepare playable JAR only
        run: |
          mkdir -p release
          find build/libs -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} release/ \;
          echo "Playable JARs:"
          ls -lh release/
          test "$(find release -name '*.jar' | wc -l)" -eq 1
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: crop-helper-mod
          path: release/*.jar
          if-no-files-found: error
